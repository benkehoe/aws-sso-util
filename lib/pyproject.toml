[tool.poetry]
name = "aws-sso-lib"
version = "1.14.0" # change in aws_sso_lib/__init__.py too
description = "Library to make AWS SSO easier"
authors = ["Ben Kehoe <ben@kehoe.io>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/benkehoe/aws-sso-util/blob/master/lib/README.md"
repository = "https://github.com/benkehoe/aws-sso-util"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries"
]

[tool.poetry.scripts]
test = 'pytest:main'
tests = 'pytest:main'

[tool.poetry.dependencies]
python = "^3.7"
# botocore = {git = "https://github.com/boto/botocore.git", rev = "v2"}
boto3 = ">=1.24.60, <2.0.0"
aws-error-utils = "^2.4"

[tool.poetry.group.dev.dependencies]
pylint = "^2.5.2"
mypy = "^0.931"
types-python-dateutil = "^2.8.7"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--verbose",
    "-ra",
    "--cov=aws_sso_lib",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests"
]

[tool.coverage.run]
source = ["aws_sso_lib"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/vendored_botocore/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
show_missing = true
precision = 2
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
